<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thi Cấp - CLB Bạch Mai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Tạo hiệu ứng nền ẩn (Watermark) từ logo.jpg */
            background-color: #f4f7f6;
            background-image: linear-gradient(rgba(244, 247, 246, 0.9), rgba(244, 247, 246, 0.9)), url('logo.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px; /* Kích thước logo chìm ở nền */
            
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.92); /* Nền trắng hơi trong suốt để nổi bật trên watermark */
            padding: 20px 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        /* Tùy chỉnh hiển thị Logo phía trên */
        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
        }

        h1 {
            margin-bottom: 8px;
            color: #d9534f; /* Màu đỏ nhận diện thương hiệu Taekwondo */
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h2 {
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 20px;
            font-weight: 500;
        }

        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .tab-btn {
            text-decoration: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        /* Nút Tab Đăng Ký */
        .tab-btn.register {
            background-color: #3498db;
            color: white;
        }

        .tab-btn.register:hover {
            background-color: #2980b9;
        }

        /* Nút Tab Danh Sách */
        .tab-btn.list {
            background-color: #2ecc71;
            color: white;
        }

        .tab-btn.list:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hiển thị Logo -->
        <img src="logo.jpg" alt="Logo Taekwondo" class="logo-img">
        
        <h1>CLB TAEKWONDO BẠCH MAI</h1>
        <h2>Hệ Thống Quản Lý Thi Cấp</h2>
        
        <div class="tab-menu">
            <!-- Mở trang đăng ký ở tab mới -->
            <a href="dangky.html" target="_blank" class="tab-btn register">Đăng Ký</a>
            
            <!-- Mở trang danh sách ở tab mới -->
            <a href="danhsach.html" target="_blank" class="tab-btn list">Xem Danh Sách</a>
        </div>
    </div>

</body>
</html>
