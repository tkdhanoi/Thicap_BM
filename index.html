<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thi Cấp - CLB Bạch Mai</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #f4f7f6;
            background-image: linear-gradient(rgba(244, 247, 246, 0.9), rgba(244, 247, 246, 0.9)), url('logo.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            padding: 25px 20px; 
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        .logo-img { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); border: 3px solid #fff; }
        h1 { margin-bottom: 8px; color: #d9534f; font-size: clamp(22px, 4.5vw, 24px); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        h2 { margin-bottom: 25px; color: #2c3e50; font-size: clamp(18px, 3.5vw, 20px); font-weight: 500; white-space: nowrap; }

        .tab-menu { display: flex; justify-content: center; gap: 8px; flex-wrap: nowrap; width: 100%; margin-bottom: 15px; }
        .tab-btn { flex: 1; text-decoration: none; padding: 12px 6px; font-size: clamp(14px, 2.8vw, 15px); font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05); white-space: nowrap; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .tab-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .tab-btn.register { background-color: #3498db; color: white; }
        .tab-btn.register:hover { background-color: #2980b9; }
        .tab-btn.list { background-color: #2ecc71; color: white; }
        .tab-btn.list:hover { background-color: #27ae60; }
        .tab-btn.result { background-color: #e67e22; color: white; }
        .tab-btn.result:hover { background-color: #d35400; }

        .admin-section { border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 10px; }
        .btn-reset-exam { background-color: #dc3545; color: white; width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-reset-exam:hover { background-color: #bb2d3b; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; animation: fadeIn 0.25s ease-out; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; width: 100%; height: 98vh; max-width: 1260px; border-radius: 12px; position: relative; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; overflow: hidden; animation: scaleUp 0.25s ease-out; }
        .close-btn { position: absolute; top: 10px; right: 10px; width: 25px; height: 25px; background: #e74c3c; color: white; border: none; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: background 0.2s, transform 0.2s; }
        .close-btn:hover { background: #c0392b; transform: scale(1.1); }
        .modal-iframe { width: 100%; height: 100%; border: none; border-radius: 12px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" alt="Logo Taekwondo" class="logo-img">
        <h1>CLB TAEKWONDO BẠCH MAI</h1>
        <h2>Hệ Thống Quản Lý Thi Cấp</h2>
        
        <div class="tab-menu">
            <button type="button" onclick="openModal('dangky.html')" class="tab-btn register">
                <i class="fa-solid fa-pen-to-square"></i> Đăng Ký
            </button>
            <button type="button" onclick="openModal('danhsach.html')" class="tab-btn list">
                <i class="fa-solid fa-list-check"></i> Xem Danh Sách
            </button>
            <button type="button" onclick="openModal('ketqua.html')" class="tab-btn result">
                <i class="fa-solid fa-award"></i> Kết Quả
            </button>
        </div>

        <div class="admin-section">
            <button type="button" class="btn-reset-exam" onclick="resetDataForNewExam()">
                <i class="fa-solid fa-rotate-right"></i> Reset Dữ Liệu Cho Kỳ Thi Mới
            </button>
        </div>
    </div>

    <div id="popupModal" class="modal">
        <div class="modal-content">
            <button type="button" class="close-btn" onclick="closeModal()" title="Đóng">&times;</button>
            <iframe id="modalIframe" class="modal-iframe" src=""></iframe>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDD2-w8VKQqHAVM_yrgzGQgVcJ0yDw8JhE",
            authDomain: "thicapbm-8f9fe.firebaseapp.com",
            databaseURL: "https://thicapbm-8f9fe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "thicapbm-8f9fe",
            storageBucket: "thicapbm-8f9fe.firebasestorage.app",
            messagingSenderId: "1071870945646",
            appId: "1:1071870945646:web:3aab38930c2f08b7d7f97f",
            measurementId: "G-SVETDQBGFR"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function openModal(url) {
            const modal = document.getElementById('popupModal');
            document.getElementById('modalIframe').src = url;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('popupModal').classList.remove('active');
            document.getElementById('modalIframe').src = ''; 
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('popupModal')) closeModal();
        };

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') closeModal();
        });

        // Hàm SHA-256 mã hóa gọn nhẹ
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function resetDataForNewExam() {
            const adminPassword = prompt("MẬT KHẨU QUẢN TRỊ VIÊN:\nNhập mật khẩu xác nhận XÓA:");
            if (adminPassword === null) return;

            const hashedInput = await sha256(adminPassword);
            const CORRECT_PASSWORD_HASH = "661c1952460bd92c5199ef7550eb716520f000481dd283f6f9e3629d4804fa79";

            if (hashedInput !== CORRECT_PASSWORD_HASH) {
                alert("Mật khẩu không đúng! Thao tác bị hủy.");
                return;
            }

            if (!confirm("⚠️ CẢNH BÁO NGHIÊM TRỌNG:\n\nBạn có chắc chắn muốn xóa dữ liệu?")) return;

            try {
                const now = new Date();
                const examBatchKey = `Dot_Thi_${now.getFullYear()}_${String(now.getMonth() + 1).padStart(2, '0')}_${String(now.getDate()).padStart(2, '0')}`;
                
                const [snapMoi, snapCoMa] = await Promise.all([
                    database.ref('voSinhMoi').once('value'),
                    database.ref('voSinhCoMa').once('value')
                ]);

                if (snapMoi.exists() || snapCoMa.exists()) {
                    await database.ref(`lichSuDangKy/${examBatchKey}`).set({
                        voSinhMoi: snapMoi.val() || null,
                        voSinhCoMa: snapCoMa.val() || null,
                        archivedAt: now.toISOString()
                    });
                }

                await Promise.all([
                    database.ref('voSinhMoi').remove(),
                    database.ref('voSinhCoMa').remove()
                ]);

                alert("🎉 ĐÃ RESET THÀNH CÔNG!");

            } catch (error) {
                console.error("Lỗi xóa dữ liệu:", error);
                alert("Có lỗi xảy ra trong quá trình xóa dữ liệu: " + error.message);
            }
        }
    </script>
</body>
</html>
