<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thi - CLB Taekwondo Bạch Mai</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 70px;
            --primary-color: #1e3c72;
            --primary-dark: #122549;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --warning-color: #e67e22;
            --danger-color: #dc3545;
            --text-light: #ffffff;
            --text-dark: #333333;
            --bg-body: #f4f7f6;
            --border-color: #e2e8f0;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR LEFT --- */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: width var(--transition-speed) ease;
            z-index: 100;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            flex-shrink: 0;
        }

        /* Khi Sidebar ở trạng thái Thu nhỏ (Collapsed) */
        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        /* Header của Sidebar */
        .sidebar-header {
            padding: 24px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            overflow: hidden;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 3px solid #fff;
            transition: all var(--transition-speed) ease;
        }

        .sidebar.collapsed .logo-img {
            width: 40px;
            height: 40px;
            margin-bottom: 0;
            border-width: 2px;
        }

        .brand-titles {
            transition: opacity var(--transition-speed) ease;
        }

        .sidebar.collapsed .brand-titles {
            display: none;
        }

        .sidebar-header h1 {
            font-size: 16px;
            color: #f1f5f9;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .sidebar-header h2 {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 400;
            margin-top: 4px;
        }

        /* Nút Thu nhỏ / Mở rộng Sidebar Desktop */
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -15px;
            width: 30px;
            height: 30px;
            background-color: var(--primary-color);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 101;
            transition: transform var(--transition-speed) ease;
        }

        .toggle-btn:hover {
            background-color: var(--accent-color);
        }

        .sidebar.collapsed .toggle-btn i {
            transform: rotate(180deg);
        }

        /* Navigation Menu */
        .sidebar-menu {
            list-style: none;
            padding: 15px 10px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .menu-item {
            margin-bottom: 8px;
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: transparent;
            color: #cbd5e1;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .nav-btn i {
            font-size: 16px;
            min-width: 20px;
            text-align: center;
        }

        .nav-btn span {
            transition: opacity var(--transition-speed) ease;
        }

        .sidebar.collapsed .nav-btn span {
            display: none;
        }

        .sidebar.collapsed .nav-btn {
            justify-content: center;
            padding: 12px 0;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateX(4px);
        }

        .sidebar.collapsed .nav-btn:hover {
            transform: none;
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        /* Styling cho từng loại tab button khi active */
        .nav-btn.register.active { background-color: var(--accent-color); }
        .nav-btn.list.active { background-color: var(--success-color); }
        .nav-btn.result.active { background-color: var(--warning-color); }

        /* Footer Sidebar */
        .sidebar-footer {
            padding: 16px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            overflow: hidden;
        }

        .btn-reset-exam {
            background-color: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            border: 1px solid var(--danger-color);
            width: 100%;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sidebar.collapsed .btn-reset-exam span {
            display: none;
        }

        .sidebar.collapsed .btn-reset-exam {
            padding: 10px 0;
        }

        .btn-reset-exam:hover {
            background-color: var(--danger-color);
            color: white;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Mobile Header Toggle */
        .top-navbar {
            display: none;
            background: var(--primary-color);
            color: white;
            padding: 12px 16px;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
            background-image: linear-gradient(rgba(244, 247, 246, 0.95), rgba(244, 247, 246, 0.95)), url('logo.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 350px;
        }

        .placeholder-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            text-align: center;
            padding: 20px;
        }

        .placeholder-screen i {
            font-size: 64px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }

        .placeholder-screen h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #334155;
        }

        /* --- RESPONSIVE STYLES --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                height: 100vh;
                transition: left 0.3s ease;
            }
            .sidebar.active { left: 0; }
            .sidebar.collapsed { width: var(--sidebar-width); } /* Không thu nhỏ kiểu icon trên mobile */
            .sidebar.collapsed .brand-titles,
            .sidebar.collapsed .nav-btn span,
            .sidebar.collapsed .btn-reset-exam span { display: inline-block; }
            .sidebar.collapsed .logo-img { width: 80px; height: 80px; margin-bottom: 12px; }
            .sidebar.collapsed .nav-btn { justify-content: flex-start; padding: 12px 16px; }
            .toggle-btn { display: none; } /* Nút thu nhỏ icon chỉ hiển thị trên Desktop */
            .top-navbar { display: flex; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR LEFT -->
    <aside class="sidebar" id="sidebar">
        <!-- Nút thu nhỏ/mở rộng sidebar trên Desktop -->
        <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebarCollapse()" title="Thu nhỏ / Mở rộng">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div>
            <div class="sidebar-header">
                <img src="logo.jpg" alt="Logo Taekwondo" class="logo-img" onerror="this.style.display='none'">
                <div class="brand-titles">
                    <h1>CLB TAEKWONDO BẠCH MAI</h1>
                    <h2>Quản Lý Thi Cấp</h2>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="menu-item">
                    <button type="button" onclick="loadPage('dangky.html', this)" class="nav-btn register" title="Đăng Ký">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Đăng Ký</span>
                    </button>
                </li>
                <li class="menu-item">
                    <button type="button" onclick="loadPage('danhsach.html', this)" class="nav-btn list" title="Danh Sách">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Danh Sách</span>
                    </button>
                </li>
                <li class="menu-item">
                    <button type="button" onclick="loadPage('ketqua.html', this)" class="nav-btn result" title="Kết Quả">
                        <i class="fa-solid fa-award"></i>
                        <span>Kết Quả</span>
                    </button>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <button type="button" class="btn-reset-exam" onclick="resetDataForNewExam()" title="Reset Kỳ Thi Mới">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Reset Kỳ Thi Mới</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Top Navbar for Mobile -->
        <div class="top-navbar">
            <button class="toggle-sidebar-btn" onclick="toggleSidebarMobile()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span style="font-weight: 600;">CLB TAEKWONDO BẠCH MAI</span>
            <div style="width: 20px;"></div>
        </div>

        <!-- Dynamic Content Display -->
        <iframe id="mainIframe" class="content-iframe" src="dangky.html" onload="hidePlaceholder()"></iframe>

        <!-- Fallback Placeholder -->
        <div id="placeholder" class="placeholder-screen" style="display: none;">
            <i class="fa-solid fa-hand-pointer"></i>
            <h3>Chào mừng tới Hệ thống Quản Lý Thi Cấp</h3>
            <p>Vui lòng chọn tính năng từ menu bên trái để bắt đầu.</p>
        </div>
    </main>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDD2-w8VKQqHAVM_yrgzGQgVcJ0yDw8JhE",
            authDomain: "thicapbm-8f9fe.firebaseapp.com",
            databaseURL: "https://thicapbm-8f9fe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "thicapbm-8f9fe",
            storageBucket: "thicapbm-8f9fe.firebasestorage.app",
            messagingSenderId: "1071870945646",
            appId: "1:1071870945646:web:3aab38930c2f08b7d7f97f",
            measurementId: "G-SVETDQBGFR"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Mặc định load trang Đăng ký khi truy cập
        window.addEventListener('DOMContentLoaded', () => {
            const defaultBtn = document.querySelector('.nav-btn.register');
            if (defaultBtn) {
                defaultBtn.classList.add('active');
            }
        });

        // Hàm chuyển trang trực tiếp trong Iframe
        function loadPage(url, btnElement) {
            const iframe = document.getElementById('mainIframe');
            iframe.src = url;

            // Highlight menu item
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }

            // Tự động đóng sidebar trên màn hình di động khi bấm chọn menu
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
        }

        // Bật/tắt thu nhỏ Sidebar trên Desktop (thành icon-only)
        function toggleSidebarCollapse() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // Bật/tắt ẩn/hiện Sidebar trên Mobile
        function toggleSidebarMobile() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function hidePlaceholder() {
            document.getElementById('placeholder').style.display = 'none';
        }

        // Mã hóa SHA-256
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Logic Reset dữ liệu kỳ thi
        async function resetDataForNewExam() {
            const adminPassword = prompt("MẬT KHẨU QUẢN TRỊ VIÊN:\nNhập mật khẩu xác nhận XÓA:");
            if (adminPassword === null) return;

            const hashedInput = await sha256(adminPassword);
            const CORRECT_PASSWORD_HASH = "661c1952460bd92c5199ef7550eb716520f000481dd283f6f9e3629d4804fa79";

            if (hashedInput !== CORRECT_PASSWORD_HASH) {
                alert("Mật khẩu không đúng! Thao tác bị hủy.");
                return;
            }

            if (!confirm("⚠️ CẢNH BÁO NGHIÊM TRỌNG:\n\nBạn có chắc chắn muốn xóa dữ liệu?")) return;

            try {
                const now = new Date();
                const examBatchKey = `Dot_Thi_${now.getFullYear()}_${String(now.getMonth() + 1).padStart(2, '0')}_${String(now.getDate()).padStart(2, '0')}`;
                
                const [snapMoi, snapCoMa] = await Promise.all([
                    database.ref('voSinhMoi').once('value'),
                    database.ref('voSinhCoMa').once('value')
                ]);

                if (snapMoi.exists() || snapCoMa.exists()) {
                    await database.ref(`lichSuDangKy/${examBatchKey}`).set({
                        voSinhMoi: snapMoi.val() || null,
                        voSinhCoMa: snapCoMa.val() || null,
                        archivedAt: now.toISOString()
                    });
                }

                await Promise.all([
                    database.ref('voSinhMoi').remove(),
                    database.ref('voSinhCoMa').remove()
                ]);

                alert("🎉 ĐÃ RESET THÀNH CÔNG!");
                // Reload lại iframe hiện tại
                document.getElementById('mainIframe').contentWindow.location.reload();

            } catch (error) {
                console.error("Lỗi xóa dữ liệu:", error);
                alert("Có lỗi xảy ra trong quá trình xóa dữ liệu: " + error.message);
            }
        }
    </script>
</body>
</html>
