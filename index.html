<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thi Cấp - CLB Bạch Mai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Tạo hiệu ứng nền ẩn (Watermark) từ logo.jpg */
            background-color: #f4f7f6;
            background-image: linear-gradient(rgba(244, 247, 246, 0.9), rgba(244, 247, 246, 0.9)), url('logo.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            /* Giảm padding hai bên để tăng không gian cho nội dung trên điện thoại */
            padding: 25px 20px; 
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%; /* Đảm bảo căn lề đẹp trên thiết bị nhỏ */
            backdrop-filter: blur(5px);
        }

        /* Tùy chỉnh hiển thị Logo phía trên */
        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
        }

        /* H1 auto co giãn font chữ và KHÔNG xuống hàng */
        h1 {
            margin-bottom: 8px;
            color: #d9534f;
            font-size: clamp(20px, 4.5vw, 24px); /* Tự co giãn theo màn hình */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap; /* Tuyệt đối không xuống hàng */
        }

        /* H2 auto co giãn tương tự */
        h2 {
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: clamp(18px, 3.5vw, 20px);
            font-weight: 500;
            white-space: nowrap;
        }

        /* Menu nút tự căn chỉnh 1 hàng */
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 8px; /* Giảm khoảng cách giữa các nút */
            flex-wrap: nowrap; /* Bắt buộc nằm trên 1 hàng */
            width: 100%;
        }

        /* Cấu hình các nút tự chia đều chiều rộng và tự chỉnh cỡ chữ */
        .tab-btn {
            flex: 1; /* Tự co giãn đều chiều rộng */
            text-decoration: none;
            padding: 12px 6px; /* Padding linh hoạt */
            font-size: clamp(13px, 2.8vw, 15px); /* Chữ tự nhỏ lại trên mobile */
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            white-space: nowrap; /* Giữ chữ trên nút không bị gãy dòng */
            text-align: center;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        /* Nút Tab Đăng Ký */
        .tab-btn.register {
            background-color: #3498db;
            color: white;
        }

        .tab-btn.register:hover {
            background-color: #2980b9;
        }

        /* Nút Tab Danh Sách */
        .tab-btn.list {
            background-color: #2ecc71;
            color: white;
        }

        .tab-btn.list:hover {
            background-color: #27ae60;
        }

        /* Nút Tab Kết Quả */
        .tab-btn.result {
            background-color: #e67e22;
            color: white;
        }

        .tab-btn.result:hover {
            background-color: #d35400;
        }

        /* ==========================================
           STYLE CHO CỬA SỔ NỔI (MODAL POPUP)
           ========================================== */
        .modal {
            display: none; /* Ẩn mặc định */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease-out;
        }

        .modal.active {
            display: flex; /* Hiển thị khi được gọi */
        }

        .modal-content {
            background: #fff;
            width: 100%;
            height: 98vh;
            max-width: 1260px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: scaleUp 0.25s ease-out;
        }

        /* Nút đóng Popup */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .close-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        /* Khung hiển thị nội dung trang con */
        .modal-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        /* Hiệu ứng hiển thị mượt mà */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hiển thị Logo -->
        <img src="logo.jpg" alt="Logo Taekwondo" class="logo-img">
        
        <h1>CLB TAEKWONDO BẠCH MAI</h1>
        <h2>Hệ Thống Quản Lý Thi Cấp</h2>
        
        <div class="tab-menu">
            <!-- Thay đổi thẻ <a> sang nút gọi hàm mở Modal -->
            <button type="button" onclick="openModal('dangky.html')" class="tab-btn register">Đăng Ký</button>
            <button type="button" onclick="openModal('danhsach.html')" class="tab-btn list">Xem Danh Sách</button>
            <button type="button" onclick="openModal('ketqua.html')" class="tab-btn result">Kết Quả</button>
        </div>
    </div>

    <!-- Khung Popup Cửa Sổ Nổi -->
    <div id="popupModal" class="modal">
        <div class="modal-content">
            <button type="button" class="close-btn" onclick="closeModal()" title="Đóng">&times;</button>
            <iframe id="modalIframe" class="modal-iframe" src=""></iframe>
        </div>
    </div>

    <script>
        // Mở Cửa sổ nổi
        function openModal(url) {
            const modal = document.getElementById('popupModal');
            const iframe = document.getElementById('modalIframe');
            iframe.src = url;
            modal.classList.add('active');
        }

        // Đóng Cửa sổ nổi và dọn bộ nhớ iframe
        function closeModal() {
            const modal = document.getElementById('popupModal');
            const iframe = document.getElementById('modalIframe');
            modal.classList.remove('active');
            iframe.src = ''; 
        }

        // Đóng khi click ra ngoài vùng khung nội dung
        window.onclick = function(event) {
            const modal = document.getElementById('popupModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Đóng khi người dùng bấm phím ESC trên bàn phím
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
